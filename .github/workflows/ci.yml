name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  contract:
    name: Lint + test contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install genlayer-test + genvm-linter
        run: pip install genlayer-test genvm-linter

      - name: genvm-lint check
        run: genvm-lint check contracts/Vulcan.py

      - name: Direct-mode tests
        run: gltest tests/direct/test_vulcan.py -v

  frontend:
    name: Lint + build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build (includes Next.js's own type check)
        working-directory: frontend
        env:
          NEXT_PUBLIC_VULCAN_CONTRACT_ADDRESS: "0xA7bE484beE1Ee5A83ffDFa370f2803F52605369F"
        run: pnpm build
