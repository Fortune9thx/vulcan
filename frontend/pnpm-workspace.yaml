# Native build scripts left unapproved (pnpm's supply-chain gate) --
# bufferutil/utf-8-validate are ws's optional native accelerators (ws
# falls back to a pure-JS implementation without them) and keccak is an
# optional native-accelerated hash used by the viem/ethereum-cryptography
# stack (falls back to @noble/hashes' pure-JS keccak). None of the three
# are required for correctness, so running their third-party postinstall
# scripts isn't worth it -- verified the app still builds and runs
# correctly without them.
allowBuilds:
  bufferutil: false
  keccak: false
  utf-8-validate: false
  # sharp: Next's optional native image-optimization backend. No
  # component uses next/image (confirmed during the security audit --
  # only the auto-generated next-env.d.ts reference exists), so there's
  # nothing to accelerate; denying it matches the same "don't run a
  # third-party native build for a feature this app doesn't use" reasoning
  # as the three above. Left as an unreachable, accepted pnpm-audit finding
  # elsewhere in this file's history for the same reason.
  sharp: false
  # unrs-resolver: NOT unused -- confirmed via `pnpm why` a real,
  # load-bearing dependency of eslint-import-resolver-typescript, which
  # eslint-config-next actually uses. Denying this one (as first attempted
  # in CI, where a clean checkout has no cached local approval unlike this
  # machine) broke `pnpm install --frozen-lockfile` outright with
  # ERR_PNPM_IGNORED_BUILDS, since pnpm treats an undecided build as
  # blocking, not just skipped. Allowed, not denied, on purpose.
  unrs-resolver: true
# Security-audit dependency pins: force safe patch versions of packages
# that are only ever pulled in transitively (wagmi/rainbowkit's wallet
# connector stack, Next's CSS pipeline) but resolve to a range with a
# known advisory. None of these are direct dependencies -- this only
# narrows which patch version pnpm picks, it doesn't change any
# already-verified direct dependency (wagmi/rainbowkit/viem stay pinned
# as-is; see rainbowkit-wagmi-nextjs-gotchas memory).
overrides:
  ws: ">=8.21.0"
  axios: ">=1.18.0"
  postcss: ">=8.5.23"
  uuid: ">=11.1.1"
